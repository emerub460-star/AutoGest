services:
  db:
    image: postgres:16-alpine
    container_name: autogest_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autogest}
      POSTGRES_USER: ${POSTGRES_USER:-autogest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autogest_dev}
    ports:
      - "5432:5432"
    volumes:
      - autogest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autogest} -d ${POSTGRES_DB:-autogest}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  autogest_pgdata: